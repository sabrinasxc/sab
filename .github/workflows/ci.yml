name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "CI build failure ${{ github.run_number }}" --body-file build.log
      - name: Fail on build
        if: steps.build.outcome == 'failure'
        run: exit 1
